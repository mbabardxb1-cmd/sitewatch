[project]
name = "sitewatch-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "SQLAlchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.1",
  "pydantic[email]==2.14.2",
  "pydantic-settings==2.16.2",
  "argon2-cffi==25.1.0",
  "celery==5.6.3",
  "redis==8.1.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "aiosmtpd==1.4.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
