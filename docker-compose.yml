# SiteWatch stack. The HTTPS reverse proxy is added in phase 8.
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: unless-stopped

  migrate:
    build: ./backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/readyz')"]
      interval: 15s
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "uptime,notify,default",
              "--concurrency", "8", "-l", "info"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Exactly one beat process. It only ticks; schedules live in PostgreSQL.
  beat:
    build: ./backend
    env_file: .env
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Local development only: catches all outgoing email (UI at http://localhost:8025).
  # Start with:  docker compose --profile dev up -d   and set SMTP_HOST=mailpit SMTP_PORT=1025 SMTP_STARTTLS=false
  mailpit:
    image: axllent/mailpit:v1.27.0
    profiles: ["dev"]
    ports: ["127.0.0.1:8025:8025"]

  web:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://api:8000" }
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
